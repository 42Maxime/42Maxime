<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e93"/>
      <stop offset="0.5" stop-color="#ff9be0"/>
      <stop offset="1" stop-color="#b517ff"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2e93" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2e93" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b517ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b517ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff2e93" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font:800 92px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:14px}
    .sub{font:600 17px 'Courier New',monospace;letter-spacing:7px}
    .gl1{animation:g1 3.2s infinite steps(1)}
    .gl2{animation:g2 3.2s infinite steps(1)}
    @keyframes g1{0%,88%,100%{transform:translate(0,0);opacity:0}90%{transform:translate(-5px,2px);opacity:.8}94%{transform:translate(4px,-2px);opacity:.8}97%{transform:translate(-2px,0);opacity:.6}}
    @keyframes g2{0%,88%,100%{transform:translate(0,0);opacity:0}91%{transform:translate(5px,-2px);opacity:.8}95%{transform:translate(-4px,2px);opacity:.8}98%{transform:translate(2px,0);opacity:.6}}
    .blink{animation:bl 1s infinite steps(1)}
    @keyframes bl{0%,50%{opacity:1}51%,100%{opacity:0}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="#0a0a0c"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <circle cx="170" cy="60" r="220" fill="url(#glow1)">
      <animate attributeName="cx" values="170;260;170" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="230" r="240" fill="url(#glow2)">
      <animate attributeName="cx" values="860;760;860" dur="11s" repeatCount="indefinite"/>
    </circle>
    <rect width="1000" height="3" fill="#ff2e93" opacity="0.25">
      <animate attributeName="y" values="-5;285" dur="5s" repeatCount="indefinite"/>
    </rect>
    <g fill="#ff9be0">
      <circle cx="120" cy="240" r="2"><animate attributeName="cy" values="260;20" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="260" r="1.6"><animate attributeName="cy" values="270;10" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="250" r="2.2"><animate attributeName="cy" values="270;10" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="260" r="1.8"><animate attributeName="cy" values="270;10" dur="9s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="240" r="1.4"><animate attributeName="cy" values="270;10" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="none" stroke="#ff2e93" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <path d="M30 70V30H70"/><path d="M930 30H970V70"/><path d="M30 210V250H70"/><path d="M970 210V250H930"/>
    </g>
    <text class="name gl1" x="500" y="145" text-anchor="middle" fill="#ff2e93">DAABZFN</text>
    <text class="name gl2" x="500" y="145" text-anchor="middle" fill="#7a00ff">DAABZFN</text>
    <text class="name" x="500" y="145" text-anchor="middle" fill="url(#g)" filter="url(#neon)">DAABZFN</text>
    <rect x="320" y="167" width="360" height="2" rx="1" fill="url(#g)"/>
    <text class="sub" x="500" y="205" text-anchor="middle" fill="#ffffff" fill-opacity="0.8">DEV &#8226; CREATIVE CODER<tspan class="blink" fill="#ff2e93">_</tspan></text>
  </g>
  <rect x="1" y="1" width="998" height="278" rx="18" fill="none" stroke="#ff2e93" stroke-opacity="0.45" stroke-width="2"/>
</svg>
