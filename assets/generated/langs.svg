<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" font-family="Consolas, monospace">
<title>Répartition des langages en pourcentage du code</title>
<rect x="0" y="0" width="480" height="240" rx="10" fill="#292831"/>
<rect x="1" y="1" width="478" height="238" rx="9" fill="#0d0d0f"/>
<rect x="0" y="20" width="4" height="20" rx="0" fill="#ff2e93"/>
<text x="24" y="34" fill="#ff2e93" font-size="18" font-weight="700" text-anchor="start">$</text>
<text x="48" y="34" fill="#ffffff" font-size="17" font-weight="400" text-anchor="start">cat langages.json</text>
<rect x="24" y="50" width="432" height="1" rx="0" fill="#302c37"/>
<rect x="55" y="62" width="1" height="159" rx="0" fill="#1c1c22"/>
<text x="40" y="114" fill="#8a8a95" font-size="13" font-weight="400" text-anchor="end">1</text>
<text x="72" y="114" fill="#8a8a95" font-size="19" font-weight="400" text-anchor="start">{</text>
<text x="40" y="136" fill="#8a8a95" font-size="13" font-weight="400" text-anchor="end">2</text>
<text x="91" y="136" fill="#ff9be0" font-size="17" font-weight="400" text-anchor="start">"Python":</text>
<text x="40" y="158" fill="#8a8a95" font-size="13" font-weight="400" text-anchor="end">3</text>
<text x="450" y="136" fill="#ffffff" font-size="17" font-weight="400" text-anchor="end">"100.0%"</text>
<text x="40" y="180" fill="#8a8a95" font-size="13" font-weight="400" text-anchor="end">4</text>
<text x="72" y="158" fill="#8a8a95" font-size="19" font-weight="400" text-anchor="start">}</text>
</svg>