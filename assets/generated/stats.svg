<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" font-family="Consolas, monospace">
<title>GitHub statistics</title>
<rect x="0" y="0" width="480" height="240" rx="10" fill="#292831"/>
<rect x="1" y="1" width="478" height="238" rx="9" fill="#0d0d0f"/>
<rect x="0" y="20" width="4" height="20" rx="0" fill="#ff2e93"/>
<text x="24" y="34" fill="#ff2e93" font-size="18" font-weight="700" text-anchor="start">$</text>
<text x="48" y="34" fill="#ffffff" font-size="17" font-weight="400" text-anchor="start">cat stats.c</text>
<rect x="24" y="50" width="432" height="1" rx="0" fill="#302c37"/>
<text x="24" y="76" fill="#ff9be0" font-size="18" font-weight="400" text-anchor="start">t_profile</text>
<text x="125" y="76" fill="#ffffff" font-size="18" font-weight="400" text-anchor="start">github = {</text>
<text x="48" y="100" fill="#ffffff" font-size="17" font-weight="400" text-anchor="start">.commits</text>
<text x="211" y="100" fill="#8a8a95" font-size="17" font-weight="400" text-anchor="start">=</text>
<text x="239" y="100" fill="#ff9be0" font-size="17" font-weight="700" text-anchor="start">11,</text>
<text x="337" y="100" fill="#8a8a95" font-size="14" font-weight="400" text-anchor="start">/* 12 months */</text>
<text x="48" y="121" fill="#ffffff" font-size="17" font-weight="400" text-anchor="start">.pull_requests</text>
<text x="211" y="121" fill="#8a8a95" font-size="17" font-weight="400" text-anchor="start">=</text>
<text x="239" y="121" fill="#ff9be0" font-size="17" font-weight="700" text-anchor="start">0,</text>
<text x="48" y="142" fill="#ffffff" font-size="17" font-weight="400" text-anchor="start">.issues</text>
<text x="211" y="142" fill="#8a8a95" font-size="17" font-weight="400" text-anchor="start">=</text>
<text x="239" y="142" fill="#ff9be0" font-size="17" font-weight="700" text-anchor="start">0,</text>
<text x="48" y="163" fill="#ffffff" font-size="17" font-weight="400" text-anchor="start">.public_repos</text>
<text x="211" y="163" fill="#8a8a95" font-size="17" font-weight="400" text-anchor="start">=</text>
<text x="239" y="163" fill="#ff9be0" font-size="17" font-weight="700" text-anchor="start">2,</text>
<text x="337" y="163" fill="#8a8a95" font-size="14" font-weight="400" text-anchor="start">/* profile */</text>
<text x="48" y="184" fill="#ffffff" font-size="17" font-weight="400" text-anchor="start">.stars</text>
<text x="211" y="184" fill="#8a8a95" font-size="17" font-weight="400" text-anchor="start">=</text>
<text x="239" y="184" fill="#ff9be0" font-size="17" font-weight="700" text-anchor="start">0,</text>
<text x="48" y="205" fill="#ffffff" font-size="17" font-weight="400" text-anchor="start">.followers</text>
<text x="211" y="205" fill="#8a8a95" font-size="17" font-weight="400" text-anchor="start">=</text>
<text x="239" y="205" fill="#ff9be0" font-size="17" font-weight="700" text-anchor="start">0,</text>
<text x="24" y="229" fill="#ffffff" font-size="18" font-weight="400" text-anchor="start">};</text>
</svg>